name: this for the bulding pushing image dockerhub frontend

on:
  push:
    branches:
      - main
    
jobs:
  publish_images:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build frontend -t ${{ secrets.DOCKER_HUB_USERNAME }}/fctp-docker-project-frontend:dev

      
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Push images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/fctp-docker-project-frontend:dev
